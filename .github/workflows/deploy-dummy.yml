name: Build and Deploy Dummy App on VPS

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Menghentikan skrip pada perintah pertama yang gagal (menyisipkan "set -e").
          # Tanpa opsi ini, kegagalan docker compose build tidak menghentikan
          # perintah berikutnya dan job tetap dilaporkan sukses.
          script_stop: true
          script: |
            # Direktori proyek di VPS
            cd /root/dummy-project

            # Tarik seluruh pembaruan kode dan tag dari repositori,
            # lalu pindah ke tag versi yang memicu pipeline ini.
            git fetch origin --tags --force
            git checkout -f ${{ github.ref_name }}

            # Jalankan proses docker compose build & deploy sekuensial.
            # Jika build gagal, eksekusi berhenti di sini.
            docker compose build

            # Tandai versi rilis hanya setelah build dipastikan berhasil
            echo "APP_VERSION=${{ github.ref_name }}" > .env

            docker compose up -d --force-recreate

            # Hapus docker image lama yang menggantung untuk hemat disk
            docker image prune -af
