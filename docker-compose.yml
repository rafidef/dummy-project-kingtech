services:
  dummy-app:
    build: .
    container_name: dummy-hello-world-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - APP_VERSION=${APP_VERSION:-unknown}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dummy-network

networks:
  dummy-network:
    name: dummy-network
    driver: bridge
